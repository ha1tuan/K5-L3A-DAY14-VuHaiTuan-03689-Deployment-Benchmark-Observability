# ============================================================
# Render Blueprint — agent Part 6 + Redis (Key Value)
# File nằm trong 06-lab-complete/, nên khi tạo Blueprint trên Render
# chỉ định "Blueprint Path" = 06-lab-complete/render.yaml.
# ============================================================
services:
  - type: web
    name: lab14-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lab14-redis
          property: connectionString

  - type: keyvalue
    name: lab14-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []                  # chỉ cho truy cập qua mạng nội bộ Render
